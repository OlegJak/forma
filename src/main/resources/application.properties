spring.application.name=forma
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/forma;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.jackson.time-zone=Europe/Tallinn
server.error.include-message=never
server.error.include-stacktrace=never
forma.base-url=${BASE_URL:http://localhost:8080}
forma.google-client-id=${GOOGLE_CLIENT_ID:}
forma.google-client-secret=${GOOGLE_CLIENT_SECRET:}
