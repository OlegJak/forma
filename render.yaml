services:
  - type: web
    name: forma-booking
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/companies
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
